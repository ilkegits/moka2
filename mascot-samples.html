<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mascot ideas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Inter:wght@400;500;600&family=Noto+Serif+SC:wght@600&display=swap" rel="stylesheet">
<style>
:root{--bg:#EFE6D6;--ink:#2B2620;--muted:#7A6F60;--card:#FFFCF6;--cream:#FBF2E1;--cream-2:#F3E2C6;--seal:#B23A2C}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:1180px;margin:0 auto;padding:28px 16px 64px}
h1{font-family:"Baloo 2",sans-serif;font-weight:800;font-size:34px;line-height:1;margin:0}
.lede{margin:8px 0 0;color:var(--muted);font-size:15px;max-width:58ch;line-height:1.5}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px;margin-top:26px}
.s{background:var(--card);border-radius:24px;overflow:hidden;box-shadow:0 1px 2px rgba(80,55,20,.08),0 14px 30px -20px rgba(80,55,20,.45)}
.stage{aspect-ratio:1/1;display:grid;place-items:center;background:radial-gradient(circle at 50% 38%,var(--cream),var(--cream-2) 85%)}
.stage>svg{width:78%;height:auto;overflow:visible}
.meta{display:flex;gap:14px;align-items:flex-start;padding:14px 16px 16px}
.mini{flex:none;width:52px;height:52px;border-radius:14px;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 50% 38%,var(--cream),var(--cream-2) 85%);box-shadow:inset 0 0 0 1px rgba(120,90,40,.12)}
.mini svg{width:86%;height:auto;overflow:visible}
.meta h2{margin:0;font-family:"Baloo 2",sans-serif;font-weight:800;font-size:21px;line-height:1.1}
.zh{font-family:"Noto Serif SC",serif;font-weight:600;font-size:16px;color:var(--seal);margin-left:6px}
.what{margin:2px 0 0;font-size:12.5px;font-weight:600;color:var(--muted)}
.meta p.note{margin:6px 0 0;font-size:13.5px;line-height:1.42;color:var(--ink)}
</style>
</head>
<body>
<main>
  <h1>Mascot ideas</h1>
  <p class="lede">Eight cute characters who could cheer you on while you practise. Same chunky outlines and pink cheeks as the jade logo, so they feel like one family. The small square shows each one at icon size.</p>
  <div class="grid" id="grid"></div>
</main>
<script>
const C = { eye: '#1D3328', blush: '#FF9AA6', gold: '#F4C14E', goldLine: '#9A6A10', red: '#E5483F', redLine: '#7E1D19',
            jade: '#5CC898', jadeLight: '#9BE3BF', jadeLine: '#1F5A41' };
let uid = 0;

/* Shared face: shiny dot eyes, tiny mouth, pink cheeks */
function face({ x = 100, y = 100, gap = 22, s = 1, eye = C.eye, mouth = 'w', blush = true, inv = false, lineCol } = {}) {
  const mc = lineCol || eye;
  const eyes = [-1, 1].map(k => {
    const ex = x + k * gap;
    return inv
      ? `<ellipse cx="${ex}" cy="${y}" rx="${7 * s}" ry="${8.4 * s}" fill="#fff"/><circle cx="${ex + .6 * s}" cy="${y + 1.6 * s}" r="${4 * s}" fill="${eye}"/><circle cx="${ex - .8 * s}" cy="${y - .2 * s}" r="${1.5 * s}" fill="#fff"/>`
      : `<ellipse cx="${ex}" cy="${y}" rx="${6.5 * s}" ry="${7.8 * s}" fill="${eye}"/><circle cx="${ex - 2.1 * s}" cy="${y - 3 * s}" r="${2.7 * s}" fill="#fff"/><circle cx="${ex + 2.2 * s}" cy="${y + 2.6 * s}" r="${1.2 * s}" fill="#fff"/>`;
  }).join('');
  const my = y + 12 * s;
  const m = mouth === 'w'
    ? `<path d="M${x - 6 * s} ${my}Q${x - 3 * s} ${my + 5 * s} ${x} ${my + .5 * s}Q${x + 3 * s} ${my + 5 * s} ${x + 6 * s} ${my}" fill="none" stroke="${mc}" stroke-width="${2.8 * s}" stroke-linecap="round" stroke-linejoin="round"/>`
    : mouth === 'smile'
    ? `<path d="M${x - 6 * s} ${my}Q${x} ${my + 7 * s} ${x + 6 * s} ${my}" fill="none" stroke="${mc}" stroke-width="${2.8 * s}" stroke-linecap="round"/>` : '';
  const b = blush ? [-1, 1].map(k => `<ellipse cx="${x + k * (gap + 14 * s)}" cy="${y + 10 * s}" rx="${8 * s}" ry="${4.8 * s}" fill="${C.blush}" opacity=".72"/>`).join('') : '';
  return b + eyes + m;
}
const shadow = (m, rx = 50, cy = 192) => m ? '' : `<ellipse cx="100" cy="${cy}" rx="${rx}" ry="6" fill="#8A6A3A" opacity=".16"/>`;
const tube = (d, line, fill, w = 14) => `<path d="${d}" fill="none" stroke="${line}" stroke-width="${w + 9}" stroke-linecap="round"/><path d="${d}" fill="none" stroke="${fill}" stroke-width="${w}" stroke-linecap="round"/>`;
const sparkle = (x, y, s, fill = C.gold) => `<path d="M${x} ${y - s}Q${x + s * .18} ${y - s * .18} ${x + s} ${y}Q${x + s * .18} ${y + s * .18} ${x} ${y + s}Q${x - s * .18} ${y + s * .18} ${x - s} ${y}Q${x - s * .18} ${y - s * .18} ${x} ${y - s}Z" fill="${fill}"/>`;
const svg = body => `<svg viewBox="0 0 200 200">${body}</svg>`;

/* 1. Baby jade dragon holding a pearl */
function dragon(m) {
  const L = C.jadeLine, J = C.jade;
  return svg(`${shadow(m, 52)}
    ${tube('M124 166C152 174 174 160 170 134C168 122 160 118 155 124', L, J, 13)}
    <path d="M156 130C146 124 147 110 156 102C156 110 161 113 166 109C171 117 167 128 156 130Z" fill="${C.red}" stroke="${C.redLine}" stroke-width="4" stroke-linejoin="round"/>
    <ellipse cx="80" cy="182" rx="13" ry="9" fill="${J}" stroke="${L}" stroke-width="5"/>
    <ellipse cx="120" cy="182" rx="13" ry="9" fill="${J}" stroke="${L}" stroke-width="5"/>
    <ellipse cx="100" cy="150" rx="38" ry="32" fill="${J}" stroke="${L}" stroke-width="5"/>
    <ellipse cx="100" cy="158" rx="22" ry="19" fill="#FFF1C9"/>
    ${tube('M78 50C74 36 66 28 60 15M69 31C63 31 57 29 52 24', L, C.gold, 7)}
    ${tube('M122 50C126 36 134 28 140 15M131 31C137 31 143 29 148 24', L, C.gold, 7)}
    <path d="M88 44C85 30 93 22 100 15C100 23 106 25 111 21C115 30 113 39 109 44Z" fill="${C.red}" stroke="${C.redLine}" stroke-width="4" stroke-linejoin="round"/>
    <ellipse cx="100" cy="86" rx="56" ry="48" fill="${J}" stroke="${L}" stroke-width="5"/>
    <ellipse cx="72" cy="58" rx="12" ry="6" transform="rotate(-28 72 58)" fill="#B6F0D2" opacity=".8"/>
    <path d="M72 106C54 112 38 106 32 94C28 86 36 80 41 87" fill="none" stroke="${C.red}" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M128 106C146 112 162 106 168 94C172 86 164 80 159 87" fill="none" stroke="${C.red}" stroke-width="4.5" stroke-linecap="round"/>
    <ellipse cx="100" cy="106" rx="30" ry="19" fill="#8FDDB6" stroke="${L}" stroke-width="4"/>
    <ellipse cx="92" cy="101" rx="2.6" ry="3.4" fill="${L}"/><ellipse cx="108" cy="101" rx="2.6" ry="3.4" fill="${L}"/>
    <path d="M92 112Q100 119 108 112" fill="none" stroke="${L}" stroke-width="3" stroke-linecap="round"/>
    ${face({ x: 100, y: 78, gap: 25, mouth: 'none', blush: false })}
    <ellipse cx="58" cy="92" rx="8" ry="4.8" fill="${C.blush}" opacity=".75"/><ellipse cx="142" cy="92" rx="8" ry="4.8" fill="${C.blush}" opacity=".75"/>
    <circle cx="100" cy="152" r="12" fill="#FFE7A8" stroke="${C.goldLine}" stroke-width="4"/>
    <circle cx="96" cy="148" r="3.6" fill="#fff"/>
    <ellipse cx="85" cy="150" rx="9" ry="7" transform="rotate(-20 85 150)" fill="${J}" stroke="${L}" stroke-width="4.5"/>
    <ellipse cx="115" cy="150" rx="9" ry="7" transform="rotate(20 115 150)" fill="${J}" stroke="${L}" stroke-width="4.5"/>
    ${m ? '' : sparkle(30, 40, 8) + sparkle(172, 58, 6)}`);
}

/* 2. Tiger cub with 王 on its forehead */
function tiger(m) {
  const L = '#8A4410', O = '#F7A03C', S = '#6B3410', W = '#FFF6E8';
  const wedge = (x, y, dir) => `<path d="M${x} ${y - 4}L${x + dir * 15} ${y}L${x} ${y + 4}Z" fill="${S}" stroke="${S}" stroke-width="2" stroke-linejoin="round"/>`;
  return svg(`${shadow(m, 52)}
    ${tube('M126 168C158 172 172 150 164 128', L, O, 12)}
    <circle cx="164" cy="128" r="8" fill="${S}"/>
    <ellipse cx="80" cy="182" rx="13" ry="9" fill="${O}" stroke="${L}" stroke-width="5"/>
    <ellipse cx="120" cy="182" rx="13" ry="9" fill="${O}" stroke="${L}" stroke-width="5"/>
    <ellipse cx="100" cy="152" rx="36" ry="30" fill="${O}" stroke="${L}" stroke-width="5"/>
    <ellipse cx="100" cy="158" rx="20" ry="18" fill="${W}"/>
    ${wedge(66, 148, 1)}${wedge(134, 148, -1)}
    <circle cx="56" cy="50" r="18" fill="${O}" stroke="${L}" stroke-width="5"/><circle cx="57" cy="52" r="9" fill="${C.blush}"/>
    <circle cx="144" cy="50" r="18" fill="${O}" stroke="${L}" stroke-width="5"/><circle cx="143" cy="52" r="9" fill="${C.blush}"/>
    <ellipse cx="100" cy="90" rx="62" ry="50" fill="${O}" stroke="${L}" stroke-width="5"/>
    <path d="M87 52H113M89 61H111M85 70H115M100 52V70" stroke="${S}" stroke-width="5" stroke-linecap="round"/>
    ${wedge(41, 80, 1)}${wedge(41, 96, 1)}${wedge(159, 80, -1)}${wedge(159, 96, -1)}
    <circle cx="89" cy="108" r="14" fill="${W}"/><circle cx="111" cy="108" r="14" fill="${W}"/>
    <path d="M93 98Q100 94 107 98Q104 105 100 106Q96 105 93 98Z" fill="#F27A8A" stroke="${L}" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M100 106V109M92 110Q96 116 100 109Q104 116 108 110" fill="none" stroke="${L}" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="84" cy="106" r="1.7" fill="${L}"/><circle cx="83" cy="112" r="1.7" fill="${L}"/><circle cx="116" cy="106" r="1.7" fill="${L}"/><circle cx="117" cy="112" r="1.7" fill="${L}"/>
    ${face({ x: 100, y: 84, gap: 27, mouth: 'none', blush: false, eye: '#2A1A0E' })}
    <ellipse cx="62" cy="100" rx="8" ry="4.8" fill="${C.blush}" opacity=".8"/><ellipse cx="138" cy="100" rx="8" ry="4.8" fill="${C.blush}" opacity=".8"/>
    <ellipse cx="80" cy="146" rx="9" ry="7" fill="${O}" stroke="${L}" stroke-width="4.5"/>
    <ellipse cx="120" cy="146" rx="9" ry="7" fill="${O}" stroke="${L}" stroke-width="4.5"/>`);
}

/* 3. Jade rabbit of the moon, hugging the YuCards jade donut */
function rabbit(m) {
  const L = '#2F7A5A', B = '#F4FBF7', id = 'moon' + (uid++);
  return svg(`${shadow(m, 48)}
    ${m ? '' : `<defs><mask id="${id}"><rect width="200" height="200" fill="#fff"/><circle cx="166" cy="34" r="20" fill="#000"/></mask></defs>
    <circle cx="154" cy="44" r="22" fill="${C.gold}" mask="url(#${id})"/>`}
    <ellipse cx="82" cy="44" rx="14" ry="34" transform="rotate(-12 82 44)" fill="${B}" stroke="${L}" stroke-width="5"/>
    <ellipse cx="82" cy="47" rx="6.5" ry="23" transform="rotate(-12 82 47)" fill="${C.jadeLight}"/>
    <ellipse cx="122" cy="48" rx="14" ry="32" transform="rotate(24 122 48)" fill="${B}" stroke="${L}" stroke-width="5"/>
    <ellipse cx="121" cy="51" rx="6.5" ry="21" transform="rotate(24 121 51)" fill="${C.jadeLight}"/>
    <circle cx="136" cy="168" r="11" fill="${B}" stroke="${L}" stroke-width="5"/>
    <ellipse cx="82" cy="182" rx="14" ry="8" fill="${B}" stroke="${L}" stroke-width="5"/>
    <ellipse cx="118" cy="182" rx="14" ry="8" fill="${B}" stroke="${L}" stroke-width="5"/>
    <ellipse cx="100" cy="156" rx="36" ry="28" fill="${B}" stroke="${L}" stroke-width="5"/>
    <ellipse cx="100" cy="100" rx="50" ry="42" fill="${B}" stroke="${L}" stroke-width="5"/>
    <ellipse cx="100" cy="109" rx="3.6" ry="2.6" fill="#F27A8A"/>
    ${face({ x: 100, y: 99, gap: 21, mouth: 'w', eye: C.eye })}
    <circle cx="100" cy="153" r="15" fill="${C.jade}" stroke="${C.jadeLine}" stroke-width="3.5"/>
    <circle cx="100" cy="153" r="5.5" fill="${B}" stroke="${C.jadeLine}" stroke-width="3"/>
    <path d="M90 146A11 11 0 0 1 98 142" fill="none" stroke="#DFFBEC" stroke-width="3" stroke-linecap="round"/>
    <circle cx="100" cy="136" r="4" fill="${C.red}" stroke="${C.redLine}" stroke-width="2"/>
    <ellipse cx="84" cy="150" rx="9" ry="7" transform="rotate(-20 84 150)" fill="${B}" stroke="${L}" stroke-width="4.5"/>
    <ellipse cx="116" cy="150" rx="9" ry="7" transform="rotate(20 116 150)" fill="${B}" stroke="${L}" stroke-width="4.5"/>
    ${m ? '' : sparkle(36, 64, 7) + sparkle(176, 92, 5)}`);
}

/* 4. Panda holding a calligraphy brush */
function panda(m) {
  const K = '#2B2B33', W = '#FFFFFF';
  return svg(`${shadow(m, 50)}
    <ellipse cx="80" cy="182" rx="14" ry="10" fill="${K}"/><ellipse cx="120" cy="182" rx="14" ry="10" fill="${K}"/>
    <ellipse cx="100" cy="152" rx="38" ry="30" fill="${W}" stroke="${K}" stroke-width="5"/>
    <circle cx="60" cy="52" r="17" fill="${K}"/><circle cx="140" cy="52" r="17" fill="${K}"/>
    <ellipse cx="100" cy="92" rx="58" ry="48" fill="${W}" stroke="${K}" stroke-width="5"/>
    <ellipse cx="76" cy="92" rx="14" ry="17" transform="rotate(28 76 92)" fill="${K}"/>
    <ellipse cx="124" cy="92" rx="14" ry="17" transform="rotate(-28 124 92)" fill="${K}"/>
    ${face({ x: 100, y: 90, gap: 23, inv: true, eye: K, mouth: 'none', blush: false })}
    <path d="M94 106Q100 103 106 106Q104 111 100 112Q96 111 94 106Z" fill="${K}"/>
    <path d="M100 112V114M94 115Q97 120 100 114Q103 120 106 115" fill="none" stroke="${K}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <ellipse cx="60" cy="112" rx="8" ry="4.8" fill="${C.blush}" opacity=".8"/><ellipse cx="140" cy="112" rx="8" ry="4.8" fill="${C.blush}" opacity=".8"/>
    <g transform="translate(150 120) rotate(37)">
      <rect x="-5" y="0" width="10" height="64" rx="4" fill="#E0B066" stroke="#7A4E18" stroke-width="3.5"/>
      <path d="M-5 26H5M-5 46H5" stroke="#7A4E18" stroke-width="2.5"/>
      <path d="M-6.5 0C-8 -10 -3 -19 0 -26C3 -19 8 -10 6.5 0Z" fill="${K}"/>
      <rect x="-7" y="-3" width="14" height="6" rx="2" fill="${C.red}" stroke="${C.redLine}" stroke-width="2"/>
    </g>
    <ellipse cx="78" cy="150" rx="12" ry="10" transform="rotate(-20 78 150)" fill="${K}"/>
    <ellipse cx="124" cy="154" rx="12" ry="10" transform="rotate(20 124 154)" fill="${K}"/>
    ${m ? '' : `<circle cx="52" cy="176" r="3" fill="${K}" opacity=".7"/><circle cx="44" cy="168" r="1.8" fill="${K}" opacity=".7"/>`}`);
}

/* 5. Chubby lucky koi */
function koi(m) {
  const L = '#8E2A1B', W = '#FFF8F2', R = '#F0563A', F = '#FFB39E', id = 'koi' + (uid++);
  return svg(`${shadow(m, 46)}
    <path d="M138 100C156 80 178 70 186 78C179 94 177 104 183 124C176 134 154 128 138 116Z" fill="${R}" stroke="${L}" stroke-width="5" stroke-linejoin="round"/>
    <path d="M152 96L176 84M154 108L178 106M152 118L174 126" stroke="#FF8A70" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M70 70C80 40 118 38 130 68Z" fill="${F}" stroke="${L}" stroke-width="4.5" stroke-linejoin="round"/>
    <ellipse cx="66" cy="152" rx="15" ry="9" transform="rotate(30 66 152)" fill="${F}" stroke="${L}" stroke-width="4.5"/>
    <ellipse cx="122" cy="154" rx="15" ry="9" transform="rotate(-30 122 154)" fill="${F}" stroke="${L}" stroke-width="4.5"/>
    <defs><clipPath id="${id}"><ellipse cx="96" cy="108" rx="54" ry="48"/></clipPath></defs>
    <ellipse cx="96" cy="108" rx="54" ry="48" fill="${W}"/>
    <g clip-path="url(#${id})">
      <ellipse cx="104" cy="64" rx="38" ry="22" fill="${R}"/>
      <circle cx="148" cy="128" r="24" fill="${R}"/>
      <path d="M118 146a7 7 0 0 1 12 0M126 134a7 7 0 0 1 12 0M110 132a7 7 0 0 1 12 0" fill="none" stroke="#F3D3C6" stroke-width="2.5" stroke-linecap="round"/>
    </g>
    <ellipse cx="96" cy="108" rx="54" ry="48" fill="none" stroke="${L}" stroke-width="5"/>
    <path d="M58 82A40 40 0 0 1 76 66" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".9"/>
    ${face({ x: 88, y: 104, gap: 22, mouth: 'none', eye: '#2A140E' })}
    <path d="M82 118Q88 126 94 118" fill="#E86A5E" stroke="${L}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M80 119C74 121 70 118 70 113M96 119C102 121 106 118 106 113" fill="none" stroke="${L}" stroke-width="2.4" stroke-linecap="round"/>
    ${m ? '' : `<circle cx="38" cy="58" r="7" fill="none" stroke="#8CC4DA" stroke-width="3"/><circle cx="26" cy="36" r="4.5" fill="none" stroke="#8CC4DA" stroke-width="2.6"/><circle cx="44" cy="22" r="3" fill="none" stroke="#8CC4DA" stroke-width="2.2"/>`}`);
}

/* 6. Lion-dance cub */
function lion(m) {
  const L = C.redLine, R = C.red, G = '#FFD15C', GL = '#A86A0C';
  const n = 14, ring = (r, extra) => Array.from({ length: n }, (_, i) => {
    const a = (i / n) * Math.PI * 2 - Math.PI / 2, x = 100 + 56 * Math.cos(a), y = 100 + 56 * Math.sin(a);
    return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r}" ${extra}/>`;
  }).join('');
  return svg(`${shadow(m, 50)}
    <ellipse cx="82" cy="178" rx="11" ry="13" fill="${R}" stroke="${L}" stroke-width="5"/>
    <ellipse cx="118" cy="178" rx="11" ry="13" fill="${R}" stroke="${L}" stroke-width="5"/>
    <ellipse cx="82" cy="188" rx="13" ry="5" fill="#fff" stroke="${L}" stroke-width="3"/>
    <ellipse cx="118" cy="188" rx="13" ry="5" fill="#fff" stroke="${L}" stroke-width="3"/>
    ${ring(17, `fill="${G}" stroke="${GL}" stroke-width="8"`)}${ring(17, `fill="${G}"`)}
    <circle cx="100" cy="100" r="50" fill="${R}" stroke="${L}" stroke-width="5"/>
    <path d="M60 116Q56 130 66 138M140 116Q144 130 134 138" fill="none" stroke="${G}" stroke-width="4" stroke-linecap="round"/>
    <path d="M91 56Q100 22 109 56Z" fill="${C.gold}" stroke="${GL}" stroke-width="4" stroke-linejoin="round"/>
    <circle cx="100" cy="64" r="7" fill="#D8F2FF" stroke="${GL}" stroke-width="3.5"/>
    <path d="M62 80Q76 66 90 78" fill="none" stroke="${L}" stroke-width="11" stroke-linecap="round"/>
    <path d="M62 80Q76 66 90 78" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
    <path d="M138 80Q124 66 110 78" fill="none" stroke="${L}" stroke-width="11" stroke-linecap="round"/>
    <path d="M138 80Q124 66 110 78" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
    ${face({ x: 100, y: 94, gap: 24, s: 1.15, mouth: 'none', eye: '#2A0E0C' })}
    <path d="M82 118Q100 144 118 118Q100 124 82 118Z" fill="${L}" stroke="${L}" stroke-width="3" stroke-linejoin="round"/>
    <ellipse cx="100" cy="128" rx="7" ry="4.5" fill="#FF8A96"/>
    <circle cx="100" cy="110" r="9" fill="#FF8A7E" stroke="${L}" stroke-width="3"/>
    <circle cx="97" cy="107" r="2.6" fill="#fff" opacity=".8"/>
    ${m ? '' : sparkle(28, 30, 8) + sparkle(176, 40, 6)}`);
}

/* 7. Steamed bun peeking out of a bamboo steamer */
function bao(m) {
  const L = '#B08A5A', B = '#FFF6E6', T = '#E8BC72', TL = '#8A5A1E';
  return svg(`${shadow(m, 60, 188)}
    ${m ? '' : `<path d="M54 70C46 60 62 54 54 42M146 70C154 60 138 54 146 42M100 38C94 30 106 24 100 14" fill="none" stroke="#CDBDA6" stroke-width="4" stroke-linecap="round"/>`}
    <ellipse cx="100" cy="130" rx="60" ry="14" fill="#C8954A" stroke="${TL}" stroke-width="5"/>
    <ellipse cx="100" cy="116" rx="52" ry="40" fill="${B}" stroke="${L}" stroke-width="5"/>
    <path d="M83 92Q90 82 97 79M90 94Q95 84 99 79M110 94Q105 84 101 79M117 92Q110 82 103 79" fill="none" stroke="#D8BB92" stroke-width="3" stroke-linecap="round"/>
    <circle cx="100" cy="80" r="5" fill="${C.red}"/>
    <ellipse cx="76" cy="92" rx="10" ry="5" transform="rotate(-25 76 92)" fill="#fff"/>
    ${face({ x: 100, y: 110, gap: 20, mouth: 'smile', eye: '#3A2A18' })}
    <path d="M40 130V170Q100 190 160 170V130Q100 146 40 130Z" fill="${T}" stroke="${TL}" stroke-width="5" stroke-linejoin="round"/>
    <path d="M42 150Q100 166 158 150M42 162Q100 178 158 162" fill="none" stroke="${TL}" stroke-width="2.5" opacity=".55"/>
    <path d="M60 140V174M80 143V180M100 145V182M120 143V180M140 140V174" stroke="${TL}" stroke-width="2" opacity=".3"/>
    <path d="M40 130Q100 146 160 130" fill="none" stroke="${TL}" stroke-width="5" stroke-linecap="round"/>`);
}

/* 8. Ink drop with a red name seal */
function ink(m) {
  const K = '#2D3250', KL = '#12152A';
  return svg(`${shadow(m, 46)}
    <ellipse cx="84" cy="182" rx="11" ry="7" fill="${K}" stroke="${KL}" stroke-width="4"/>
    <ellipse cx="116" cy="182" rx="11" ry="7" fill="${K}" stroke="${KL}" stroke-width="4"/>
