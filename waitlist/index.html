<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#FFFFFF">
<title>ShiHanzi · Join the waiting list</title>
<meta name="description" content="A calm way to learn Chinese characters. Join the ShiHanzi waiting list.">
<meta property="og:title" content="ShiHanzi · Good things are written slowly">
<meta property="og:description" content="静候佳音，好东西，都是慢慢写出来的。 Join the ShiHanzi waiting list.">
<meta property="og:image" content="https://shihanzi.vercel.app/og.png">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="favicon-64.png">
<link rel="canonical" href="https://shihanzi.vercel.app/">
<script>
  // The waiting list lives at shihanzi.vercel.app; the old GitHub address forwards there (keeping ?ref=).
  if (location.hostname.endsWith('github.io')) location.replace('https://shihanzi.vercel.app/' + location.search);
</script>
<script src="strokes.js"></script>
<style>
  :root { --ink:#1C1A19; --mute:#6E6A66; --soft:#9A948F; --line:#ECE8E4; --edge:#E3D6D1; --red:#B23A2C; --red-d:#9A3024; }
  * { box-sizing:border-box; }
  html, body { margin:0; background:#fff; color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif; -webkit-font-smoothing:antialiased; }
  main { max-width:520px; margin:0 auto; padding:56px 16px 36px; min-height:100svh; display:flex; flex-direction:column; }
  .paper { display:block; width:100%; height:auto; }
  .copy { padding:40px 12px 0; }
  h1 { margin:0; font-size:clamp(28px, 7vw, 34px); line-height:1.15; font-weight:600; letter-spacing:-.02em; }
  .sub { margin:12px 0 0; font-size:16px; line-height:25px; color:var(--mute); }

  form { margin:26px 0 0; display:flex; gap:10px; }
  .field { flex:1; min-width:0; height:50px; padding:0 16px; border:1.5px solid var(--edge); border-radius:10px; font:inherit; font-size:16px; color:var(--ink); background:#fff; outline:none; transition:border-color .15s; }
  .field::placeholder { color:#B3ADA8; }
  .field:focus, .field[aria-invalid="true"] { border-color:var(--red); }
  .go { height:50px; padding:0 20px; border:0; border-radius:10px; background:var(--red); color:#fff; font:inherit; font-size:15.5px; font-weight:600; cursor:pointer; white-space:nowrap; transition:background .15s, transform .1s; }
  .go:hover { background:var(--red-d); }
  .go:active { transform:translateY(1px); }
  .go:focus-visible, .field:focus-visible { outline:2px solid var(--red); outline-offset:2px; }
  .go[disabled] { opacity:.6; cursor:default; }
  .hp { position:absolute; left:-9999px; width:1px; height:1px; overflow:hidden; }
  .msg { margin:10px 2px 0; font-size:14px; line-height:20px; color:var(--red); }
  .msg:empty { display:none; }
  .note { margin:12px 2px 0; font-size:13px; line-height:19px; color:var(--soft); }

  .done { display:none; margin:26px 0 0; }
  .done b { display:block; font-size:18px; font-weight:600; }
  .done p { margin:6px 0 0; font-size:15px; line-height:23px; color:var(--mute); }
  .joined form, .joined .note, .joined .msg { display:none; }
  .joined .done { display:block; animation:rise .5s .45s both cubic-bezier(.2,.7,.2,1); }
  @keyframes rise { from { opacity:0; transform:translateY(6px); } }

  footer { margin-top:auto; padding:56px 12px 0; }
  footer p { margin:0; padding-top:16px; border-top:1px solid var(--line); font-size:12px; line-height:18px; color:#A29D98; }

  @media (max-width:430px) {
    main { padding-top:36px; }
    form { flex-direction:column; }
    .field { flex:none; width:100%; }
    .go { width:100%; }
  }
  @media (prefers-reduced-motion: reduce) { .joined .done { animation:none; } }
</style>
</head>
<body>
<main>
  <svg class="paper" id="paper" role="img" aria-label="Chinese essay paper. Written in the squares: 静候佳音，好东西，都是慢慢写出来的。 Wait quietly for good news. Good things are all written slowly."></svg>

  <section class="copy" id="copy">
    <h1>Good things are written slowly.</h1>
    <p class="sub">A calm way to learn Chinese characters. We'll write once, when your place opens.</p>

    <form id="join" novalidate>
      <label class="hp" aria-hidden="true">Website <input name="website" tabindex="-1" autocomplete="off"></label>
      <input class="field" id="email" name="email" type="email" inputmode="email" autocomplete="email" placeholder="you@email.com" aria-label="Your email" required>
      <button class="go" id="go" type="submit">Join the waiting list</button>
    </form>
    <p class="msg" id="msg" role="alert"></p>
    <p class="note">Only to tell you when ShiHanzi opens. Nothing else, ever.</p>

    <div class="done" id="done" aria-live="polite">
      <b>You're on the list.</b>
      <p>Your place is kept. We'll write once, when it opens.</p>
    </div>
  </section>

  <footer><p>ShiHanzi 狮汉字</p></footer>
</main>

<script>
const SB_URL = 'https://grzuyqtbfmaonzzmopny.supabase.co', SB_KEY = 'sb_publishable_25E6zhjRVNiv7-UvfmkjaA_ZR3Tvg77';
const INK = '#1C1A19', RED = '#B23A2C', LINE = '#E9C9C3';
const NS = 'http://www.w3.org/2000/svg';
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const el = (n, a = {}, p) => { const e = document.createElementNS(NS, n); for (const k in a) e.setAttribute(k, a[k]); if (p) p.appendChild(e); return e; };
const len = pts => { let L = 0; for (let i = 1; i < pts.length; i++) L += Math.hypot(pts[i][0]-pts[i-1][0], pts[i][1]-pts[i-1][1]); return L; };
const ease = x => x < 0 ? 0 : x > 1 ? 1 : 1 - Math.pow(1 - x, 2.2);

/* 稿纸: 11 squares a row, 4 rows, a gap between rows. Two empty squares open the essay. */
const COLS = 11, C = 30, GAP = 10, ROWS = ['  静候佳音，', '好东西，都是慢慢写', '出来的。', ''];
const W = COLS * C, H = ROWS.length * C + (ROWS.length - 1) * GAP;
const svg = document.getElementById('paper');
svg.setAttribute("viewBox", `-1 -1 ${W + 2} ${H + 16}`);   // room below for the seal

/* Timeline: the first line is written slowly, stroke by stroke; the rest follows at a quicker hand. */
const cells = []; let t0 = 0.5;
ROWS.forEach((row, r) => [...row].forEach((ch, c) => {
  const x = c * C, y = r * (C + GAP);
  if (ch === ' ') return;
  if (!STROKES[ch]) { cells.push({ ch, x, y, punct: true, at: t0 }); t0 += 0.12; return; }
  const slow = r === 0;
  const strokes = STROKES[ch].medians.map(m => { const dur = slow ? 0.035 + len(m) / 1024 * 0.12 : 0.008 + len(m) / 1024 * 0.025;
    const s = { start: t0, dur }; t0 += dur + (slow ? 0.015 : 0.003); return s; });
  cells.push({ ch, x, y, strokes });
  t0 += slow ? 0.1 : 0.03;
}));
const WRITTEN = t0, STAMP_D = 0.34;
let stampAt = null;

function render(t) {
  svg.textContent = '';
  ROWS.forEach((_, r) => {
    const y = r * (C + GAP);
    el('rect', { x: 0, y, width: W, height: C, fill: '#fff', stroke: LINE, 'stroke-width': 1 }, svg);
    for (let c = 1; c < COLS; c++) el('line', { x1: c * C, y1: y, x2: c * C, y2: y + C, stroke: LINE, 'stroke-width': 1 }, svg);
  });
  cells.forEach((cell, n) => {
    if (cell.punct) {
      if (t < cell.at) return;
      // Chinese punctuation sits low in the left of its square: drawn, so no font can turn it into a Western comma.
      const px = cell.x + 8, py = cell.y + 21;
      if (cell.ch === '。') el('circle', { cx: px, cy: py, r: 3, fill: 'none', stroke: RED, 'stroke-width': 1.4 }, svg);
      else { el('circle', { cx: px, cy: py, r: 2.3, fill: RED }, svg);
        el('path', { d: `M${px + 2.1} ${py + .6} Q${px + 1.6} ${py + 4.2} ${px - 1.4} ${py + 6}`, fill: 'none', stroke: RED, 'stroke-width': 1.5, 'stroke-linecap': 'round' }, svg); }
      return;
    }
    const d = STROKES[cell.ch], k = C * 0.8 / 1024, off = C * 0.1;
    const g = el('g', { transform: `translate(${cell.x + off},${cell.y + off}) scale(${k}) translate(0,900) scale(1,-1)` }, svg);
    d.strokes.forEach((s, i) => {
      const p = ease((t - cell.strokes[i].start) / cell.strokes[i].dur); if (p <= 0) return;
      if (p >= 1) { el('path', { d: s, fill: INK }, g); return; }
      const cp = el('clipPath', { id: `c${n}_${i}` }, g); el('path', { d: s }, cp);
      const m = d.medians[i], L = len(m);
      el('polyline', { points: m.map(q => q.join(',')).join(' '), fill: 'none', stroke: INK, 'stroke-width': 190, 'stroke-linecap': 'round', 'stroke-linejoin': 'round',
        'stroke-dasharray': `${L} ${L + 400}`, 'stroke-dashoffset': L * (1 - p), 'clip-path': `url(#c${n}_${i})` }, g);
    });
  });
  // The seal lands at the end of the last row when someone joins, the way a letter is signed.
  if (stampAt != null) {
    const p = Math.min(1, (t - stampAt) / STAMP_D); if (p <= 0) return;
    const sc = p < .55 ? 1.6 - .68 * ease(p / .55) : .92 + .08 * ease((p - .55) / .45);
    const cx = W - C * 1.5, cy = 3 * (C + GAP) + C / 2, S = 44;
    el('image', { href: "seal.svg", x: -S / 2, y: -S / 2, width: S, height: S, opacity: Math.min(1, p / .4) * .95,
      transform: `translate(${cx},${cy}) rotate(-8) scale(${sc})` }, svg);
  }
}

let start = null;
function frame(now) {
  if (start == null) start = now;
  const t = REDUCED ? 99 : (now - start) / 1000;
  render(t);
  const end = stampAt == null ? WRITTEN : stampAt + STAMP_D + .05;
  if (t < end) requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
const clock = () => start == null ? 0 : (performance.now() - start) / 1000;
window.__paper = { render, WRITTEN, STAMP_D, stamp: t => { stampAt = t; } };   // used to record the animation for checks

/* Joining */
const form = document.getElementById('join'), email = document.getElementById('email'), go = document.getElementById('go'), msg = document.getElementById('msg');
const OK = /^[^@\s]+@[^@\s]+\.[^@\s]+$/;
function joined() {
  document.getElementById('copy').classList.add('joined');
  stampAt = REDUCED ? -99 : Math.max(clock(), WRITTEN);
  if (REDUCED) render(99); else requestAnimationFrame(frame);
}
email.addEventListener('input', () => { email.removeAttribute('aria-invalid'); msg.textContent = ''; });
form.addEventListener('submit', async e => {
  e.preventDefault();
  const v = email.value.trim();
  if (form.website.value) { joined(); return; }              // a bot filled the hidden field
  if (!OK.test(v) || v.length > 254) { email.setAttribute('aria-invalid', 'true'); msg.textContent = 'That email looks incomplete. Check it and try again.'; email.focus(); return; }
  go.disabled = true; go.textContent = 'Joining…'; msg.textContent = '';
  try {
    const r = await fetch(SB_URL + '/rest/v1/rpc/join_waitlist', {
      method: 'POST', headers: { apikey: SB_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ p_email: v, p_source: new URLSearchParams(location.search).get('ref') || 'page' })
    });
    if (!r.ok) throw new Error(r.status);
    joined();
  } catch (err) {
    msg.textContent = 'Could not reach the list just now. Try again in a moment.';
    go.disabled = false; go.textContent = 'Join the waiting list';
  }
});
</script>
</body>
</html>
